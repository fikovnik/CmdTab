name: build

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  app:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - name: Toolchain
        run: swift --version && xcodebuild -version

      # Use an ad hoc signature because the runner has no certificate.
      - name: Tests
        run: make test

      - name: Build app
        run: make app IDENTITY=-

      - name: Check the bundle
        run: |
          codesign --verify --deep --strict --verbose=2 build/CmdTab.app
          test "$(/usr/libexec/PlistBuddy -c 'Print :CFBundleIdentifier' \
            build/CmdTab.app/Contents/Info.plist)" = net.fikovnik.cmdtab

      # Keep bundle links and file permissions.
      - name: Package
        run: ditto -c -k --keepParent build/CmdTab.app CmdTab.zip

      - uses: actions/upload-artifact@v4
        with:
          name: CmdTab
          path: CmdTab.zip
          if-no-files-found: error

      - name: Publish release
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "${GITHUB_REF_NAME}" CmdTab.zip
             --title "${GITHUB_REF_NAME}" --generate-notes
